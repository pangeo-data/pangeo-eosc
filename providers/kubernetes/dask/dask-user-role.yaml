apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dask-cluster-role
  namespace: c-scale-pangeo-dask # replace this
rules:
  - apiGroups:
      - kubernetes.dask.org
    resources:
      - daskclusters
      - daskworkergroups
      - daskjobs
      - daskautoscalers
    verbs:
      - get
      - list
      - watch
      - patch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/status
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
